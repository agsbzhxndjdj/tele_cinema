name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate android + web folders
        run: flutter create . --platforms android,web --no-overwrite

      - name: Inject keystore + google-services
        run: |
          if [ -f KEYSTORE_B64 ]; then base64 -d -i KEYSTORE_B64 > android/app/telecinema.keystore; echo "keystore decoded OK"; fi
          if [ -f telecinema.keystore ]; then cp telecinema.keystore android/app/telecinema.keystore; echo "keystore copied OK"; fi
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "google-services copied OK"; fi

      - name: Verify files exist
        run: |
          echo "=== الملفات الموجودة في lib ==="
          ls -la lib/
          echo ""
          echo "=== محتوى lib/app_tv.dart (أول 10 أسطر) ==="
          if [ -f lib/app_tv.dart ]; then head -10 lib/app_tv.dart; else echo "⚠️ lib/app_tv.dart غير موجود!"; exit 1; fi
          echo ""
          echo "=== محتوى lib/main.dart (أول 10 أسطر) ==="
          head -10 lib/main.dart

      - name: Patch gradle
        run: |
          python3 - << 'PYEOF'
          import re
          p = 'android/settings.gradle'
          s = open(p).read()
          if 'google-services' not in s:
              m = re.search(r'plugins\s*\{[^}]*\}', s)
              if m:
                  old = m.group(0)
                  new = old[:-1] + '\n    id "com.google.gms.google-services" version "4.4.0" apply false\n}'
                  s = s.replace(old, new)
                  open(p, 'w').write(s)
          p = 'android/app/build.gradle'
          s = open(p).read()
          if 'com.google.gms.google-services' not in s:
              m = re.search(r'plugins\s*\{[^}]*\}', s)
              if m:
                  old = m.group(0)
                  new = old[:-1] + '\n    id "com.google.gms.google-services"\n}'
                  s = s.replace(old, new)
          sig = """    signingConfigs {
              release {
                  storeFile file('telecinema.keystore')
                  storePassword '12345678'
                  keyAlias 'telecinema'
                  keyPassword '12345678'
              }
          }
          """
          if 'signingConfigs' not in s:
              s = s.replace('    buildTypes {', sig + '\n    buildTypes {', 1)
          s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', s)
          s = re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk = 35', s)
          s = re.sub(r'compileSdk\s+flutter\.compileSdkVersion', 'compileSdk = 35', s)
          if 'compileSdk' not in s:
              s = re.sub(r'android\s*\{', 'android {\n    compileSdk = 35', s, count=1)
          s = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', s)
          s = re.sub(r'targetSdk\s*=?\s*\d+', 'targetSdk = 35', s)
          s = re.sub(r'targetSdk\s+flutter\.targetSdkVersion', 'targetSdk = 35', s)
          open(p, 'w').write(s)
          print('✅ gradle patched')
          PYEOF

      - name: Patch AndroidManifest and MainActivity safely
        run: |
          python3 << 'PYEOF'
          import re, glob

          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r', encoding='utf-8') as f:
              s = f.read()

          perms = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>'
          ]
          for perm in perms:
              if perm not in s:
                  s = s.replace('<uses-permission android:name="android.permission.INTERNET"/>',
                                '<uses-permission android:name="android.permission.INTERNET"/>\n    ' + perm, 1)

          feats = [
              '<uses-feature android:name="android.software.leanback" android:required="false" />',
              '<uses-feature android:name="android.hardware.touchscreen" android:required="false" />'
          ]
          for feat in feats:
              if feat not in s:
                  s = s.replace('<application', feat + '\n    <application', 1)

          if 'android:usesCleartextTraffic="true"' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)

          s = re.sub(r'android:label="[^"]*"', 'android:label="تلي سينما"', s)

          if 'LEANBACK_LAUNCHER' not in s:
              s = s.replace('<category android:name="android.intent.category.LAUNCHER"/>',
                            '<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>')

          if 'supportsPictureInPicture' not in s:
              s = re.sub(r'(<activity[^>]*\.MainActivity[^>]*?)(/?>)',
                         r'\1 android:supportsPictureInPicture="true" \2',
                         s, count=1)

          with open(p, 'w', encoding='utf-8') as f:
              f.write(s)
          print('✅ AndroidManifest patched')

          k_files = glob.glob('android/app/src/main/**/MainActivity.kt', recursive=True)
          if k_files:
              k = k_files[0]
              with open(k, 'r', encoding='utf-8') as f:
                  pkg = f.readline().strip()
              
              kotlin_code = pkg + "\n\n" + """
              import android.content.pm.PackageManager
              import io.flutter.embedding.android.FlutterActivity
              import io.flutter.embedding.engine.FlutterEngine
              import io.flutter.plugin.common.MethodChannel
              class MainActivity : FlutterActivity() {
                  override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                      super.configureFlutterEngine(flutterEngine)
                      MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "tele_cinema/device")
                          .setMethodCallHandler { call, result ->
                              when (call.method) {
                                  "isTv" -> {
                                      val pm = packageManager
                                      result.success(pm.hasSystemFeature(PackageManager.FEATURE_LEANBACK) || pm.hasSystemFeature(PackageManager.FEATURE_TELEVISION))
                                  }
                                  "openExternal" -> {
                                      val url = call.argument<String>("url")
                                      if (url == null) { result.success(false); return@setMethodCallHandler }
                                      val uri = android.net.Uri.parse(url)
                                      val intent = android.content.Intent(android.content.Intent.ACTION_VIEW, uri)
                                      intent.setDataAndType(uri, "video/*")
                                      try {
                                          startActivity(android.content.Intent.createChooser(intent, "Play with"))
                                          result.success(true)
                                      } catch (e: Exception) { result.success(false) }
                                  }
                                  "saveToDownloads" -> {
                                      val name = call.argument<String>("name") ?: "telecinema_backup.json"
                                      val content = call.argument<String>("content") ?: ""
                                      try {
                                          if (android.os.Build.VERSION.SDK_INT >= 29) {
                                              val resolver = contentResolver
                                              val uri = android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI
                                              resolver.delete(uri, android.provider.MediaStore.Downloads.DISPLAY_NAME + "=?", arrayOf(name))
                                              val values = android.content.ContentValues().apply {
                                                  put(android.provider.MediaStore.Downloads.DISPLAY_NAME, name)
                                                  put(android.provider.MediaStore.Downloads.MIME_TYPE, "application/json")
                                                  put(android.provider.MediaStore.Downloads.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS)
                                              }
                                              val u = resolver.insert(uri, values)
                                              u?.let { resolver.openOutputStream(it)?.use { os -> os.write(content.toByteArray()) } }
                                              result.success(u != null)
                                          } else {
                                              val f = java.io.File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), name)
                                              f.writeText(content)
                                              result.success(true)
                                          }
                                      } catch (e: Exception) { result.success(false) }
                                  }
                                  "readFromDownloads" -> {
                                      val name = call.argument<String>("name") ?: "telecinema_backup.json"
                                      var text: String? = null
                                      try {
                                          if (android.os.Build.VERSION.SDK_INT >= 29) {
                                              val uri = android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI
                                              val cur = contentResolver.query(uri, arrayOf(android.provider.MediaStore.Downloads._ID), android.provider.MediaStore.Downloads.DISPLAY_NAME + "=?", arrayOf(name), null)
                                              cur?.use {
                                                  if (it.moveToFirst()) {
                                                      val u = android.content.ContentUris.withAppendedId(uri, it.getLong(0))
                                                      text = contentResolver.openInputStream(u)?.use { s -> String(s.readBytes()) }
                                                  }
                                              }
                                          } else {
                                              val f = java.io.File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), name)
                                              if (f.exists()) text = f.readText()
                                          }
                                      } catch (e: Exception) { }
                                      result.success(text)
                                  }
                                  "enterPip" -> {
                                      if (android.os.Build.VERSION.SDK_INT >= 26) {
                                          enterPictureInPictureMode(android.app.PictureInPictureParams.Builder().setAspectRatio(android.util.Rational(16, 9)).build())
                                          result.success(true)
                                      } else result.success(false)
                                  }
                                  else -> result.notImplemented()
                              }
                          }
                  }
              }
              """
              with open(k, 'w', encoding='utf-8') as f:
                  f.write(kotlin_code)
              print('✅ MainActivity patched')
          PYEOF

      - name: Patch backup file picker
        run: |
          python3 << 'PYEOF'
          import glob
          k = glob.glob('android/app/src/main/**/MainActivity.kt', recursive=True)[0]
          c = open(k, encoding='utf-8').read()
          if 'pickBackup' not in c:
              c = c.replace('class MainActivity : FlutterActivity() {', '''class MainActivity : FlutterActivity() {
              private var pendingBackupResult: MethodChannel.Result? = null
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: android.content.Intent?) {
              if (requestCode == 1001) {
              val r = pendingBackupResult
              pendingBackupResult = null
              if (resultCode == RESULT_OK && data != null && data.data != null) {
              val text = contentResolver.openInputStream(data.data!!)?.use { String(it.readBytes()) }
              r?.success(text)
              } else { r?.success(null) }
              } else { super.onActivityResult(requestCode, resultCode, data) }
              }''', 1)
              c = c.replace('else -> result.notImplemented()', '''"pickBackup" -> {
              pendingBackupResult = result
              val intent = android.content.Intent(android.content.Intent.ACTION_GET_CONTENT)
              intent.type = "*/*"
              startActivityForResult(android.content.Intent.createChooser(intent, "Select backup"), 1001)
              }
              else -> result.notImplemented()''', 1)
              open(k, 'w', encoding='utf-8').write(c)
              print('✅ backup picker patched')
          PYEOF

      - name: Prepare (pub get + icons)
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons:main || echo "⚠️ launcher icons skipped"

      - name: Build MOBILE APK
        run: |
          echo "=== بناء تطبيق الجوال ==="
          flutter build apk --release -t lib/main.dart
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/tele-cinema-MOBILE.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Build TV APK
        run: |
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read().replace('android:label=\"تلي سينما\"', 'android:label=\"تلي سينما TV\"')
          open(p, 'w').write(s)
          print('✅ TV label patched')
          "
          echo "=== بناء تطبيق التلفزيون ==="
          flutter build apk --release -t lib/app_tv.dart
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/tele-cinema-TV.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Build WEB
        run: |
          echo "=== بناء نسخة الويب ==="
          flutter build web --release -t lib/main_web.dart --base-href /
          cd build/web && zip -r ../../web.zip . && cd ../..

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-web
          path: web.zip

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-apks
          path: |
            build/app/outputs/flutter-apk/tele-cinema-MOBILE.apk
            build/app/outputs/flutter-apk/tele-cinema-TV.apk
