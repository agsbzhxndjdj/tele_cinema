name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate android folder
        run: flutter create . --platforms android --no-overwrite

      - name: Inject keystore + google-services
        run: |
          if [ -f KEYSTORE_B64 ]; then base64 -d -i KEYSTORE_B64 > android/app/telecinema.keystore; echo "keystore decoded OK"; fi
          if [ -f telecinema.keystore ]; then cp telecinema.keystore android/app/telecinema.keystore; echo "keystore copied OK"; fi
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "google-services copied OK"; fi

      # ✅✅✅ تحقق من الملفات قبل أي تعديل ✅✅✅
      - name: Verify files exist
        run: |
          echo "=== الملفات الموجودة في lib ==="
          ls -la lib/
          echo ""
          echo "=== محتوى lib/app_tv.dart (أول 10 أسطر) ==="
          if [ -f lib/app_tv.dart ]; then
            head -10 lib/app_tv.dart
          else
            echo "⚠️  الملف lib/app_tv.dart غير موجود!"
            exit 1
          fi
          echo ""
          echo "=== محتوى lib/main.dart (أول 10 أسطر) ==="
          head -10 lib/main.dart

      - name: Patch gradle (google-services + signing + compileSdk 35)
        run: |
          python3 - << 'PYEOF'
          import re

          # 1) settings.gradle
          p = 'android/settings.gradle'
          s = open(p).read()
          if 'google-services' not in s:
              m = re.search(r'plugins\s*\{[^}]*\}', s)
              if m:
                  old = m.group(0)
                  new = old[:-1] + '\n    id "com.google.gms.google-services" version "4.4.0" apply false\n}'
                  s = s.replace(old, new)
                  open(p, 'w').write(s)
                  print('settings.gradle patched')

          # 2) app/build.gradle
          p = 'android/app/build.gradle'
          s = open(p).read()

          # إضافة google-services
          if 'com.google.gms.google-services' not in s:
              m = re.search(r'plugins\s*\{[^}]*\}', s)
              if m:
                  old = m.group(0)
                  new = old[:-1] + '\n    id "com.google.gms.google-services"\n}'
                  s = s.replace(old, new)

          # إضافة signingConfigs
          sig = """    signingConfigs {
              release {
                  storeFile file('telecinema.keystore')
                  storePassword '12345678'
                  keyAlias 'telecinema'
                  keyPassword '12345678'
              }
          }
          """
          if 'signingConfigs' not in s:
              s = s.replace('    buildTypes {', sig + '\n    buildTypes {', 1)
          s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

          # ✅✅✅ تعديل compileSdk إلى 35 (بسيط ومضمون) ✅✅✅
          # جرب جميع الأنماط الممكنة
          s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', s)
          s = re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk = 35', s)
          s = re.sub(r'compileSdk\s+flutter\.compileSdkVersion', 'compileSdk = 35', s)

          # إذا ما كانت موجودة أبداً، أضفها
          if 'compileSdk' not in s:
              s = re.sub(r'android\s*\{', 'android {\n    compileSdk = 35', s, count=1)

          # أيضاً targetSdk و minSdk
          s = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', s)
          s = re.sub(r'targetSdk\s*=?\s*\d+', 'targetSdk = 35', s)
          s = re.sub(r'targetSdk\s+flutter\.targetSdkVersion', 'targetSdk = 35', s)

          open(p, 'w').write(s)
          print('✅ gradle patched (google-services + signing + compileSdk 35)')
          PYEOF

          # عرض الأسطر المعدلة للتأكد
          echo "=== سطور compileSdk في build.gradle ==="
          grep -n "compileSdk\|targetSdk" android/app/build.gradle || echo "لم يتم العثور على compileSdk!"

      - name: Patch AndroidManifest (HTTP + الاسم + Android TV + الإشعارات)
        run: |
          sed -i 's|<application|<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="تلي سينما"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<category android:name="android.intent.category.LAUNCHER"/>|<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>|' android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic\|LEANBACK\|POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml

      - name: Patch MainActivity (كشف TV + تشغيل خارجي Cast)
        run: |
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          PKG=$(head -n 1 "$MAIN_ACT")
          {
            echo "$PKG"
            echo ''
            echo 'import android.content.pm.PackageManager'
            echo 'import io.flutter.embedding.android.FlutterActivity'
            echo 'import io.flutter.embedding.engine.FlutterEngine'
            echo 'import io.flutter.plugin.common.MethodChannel'
            echo ''
            echo 'class MainActivity : FlutterActivity() {'
            echo '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {'
            echo '        super.configureFlutterEngine(flutterEngine)'
            echo '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "tele_cinema/device")'
            echo '            .setMethodCallHandler { call, result ->'
            echo '                if (call.method == "isTv") {'
            echo '                    val pm = packageManager'
            echo '                    result.success('
            echo '                        pm.hasSystemFeature(PackageManager.FEATURE_LEANBACK) ||'
            echo '                            pm.hasSystemFeature(PackageManager.FEATURE_TELEVISION)'
            echo '                    )'
            echo '                } else if (call.method == "openExternal") {'
            echo '                    val url = call.argument<String>("url")'
            echo '                    if (url == null) { result.success(false); return@setMethodCallHandler }'
            echo '                    val uri = android.net.Uri.parse(url)'
            echo '                    val intent = android.content.Intent(android.content.Intent.ACTION_VIEW, uri)'
            echo '                    intent.setDataAndType(uri, "video/*")'
            echo '                    try {'
            echo '                        startActivity(android.content.Intent.createChooser(intent, "تشغيل بواسطة"))'
            echo '                        result.success(true)'
            echo '                    } catch (e: Exception) {'
            echo '                        result.success(false)'
            echo '                    }'
            echo '                } else {'
            echo '                    result.notImplemented()'
            echo '                }'
            echo '            }'
            echo '    }'
            echo '}'
          } > "$MAIN_ACT"
          cat "$MAIN_ACT"

      - name: Prepare (pub get + icons)
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons:main

      # ✅✅✅ خطوة جديدة: إصلاح الأسطر المكسورة (\n) في ملفات Dart ✅✅✅
      - name: Fix broken string literals in Dart files
        run: |
          python3 << 'PYEOF'
          import os
          import re

          files = ['lib/core.dart', 'lib/tv.dart', 'lib/ui.dart']

          for filepath in files:
              if not os.path.exists(filepath):
                  print(f'⚠️ {filepath} غير موجود - تخطي')
                  continue

              with open(filepath, 'r', encoding='utf-8') as f:
                  lines = f.readlines()

              fixed_lines = []
              i = 0
              fixes = 0

              while i < len(lines):
                  line = lines[i]
                  stripped = line.rstrip('\n').rstrip('\r')

                  # عدد علامات التنصيص الفردية (غير escaped)
                  single_quotes = len(re.findall(r"(?<!\\)'", stripped))
                  double_quotes = len(re.findall(r'(?<!\\)"', stripped))

                  # إذا كان السطر يحتوي على عدد فردي من علامات تنصيص، قد يكون مكسور
                  is_broken = (single_quotes % 2 == 1) or (double_quotes % 2 == 1)

                  if is_broken and i + 1 < len(lines):
                      # تحقق أن السطر التالي يبدو مكملاً (ليس class/def/void/etc)
                      next_line = lines[i + 1]
                      next_stripped = next_line.lstrip()

                      # إذا السطر التالي يبدأ بكلمة محجوزة، لا تدمج
                      reserved_start = ('class ', 'def ', 'void ', 'static ', 'final ', 'var ',
                                        'return ', 'if ', 'for ', 'while ', 'import ', 'export ',
                                        '@override', '//', '/*', '*')
                      is_continuation = not any(next_stripped.startswith(r) for r in reserved_start)

                      if is_continuation and len(next_stripped) < 200:
                          merged = stripped + '\n' + next_stripped
                          fixed_lines.append(merged)
                          fixes += 1
                          i += 2
                          continue

                  fixed_lines.append(line)
                  i += 1

              if fixes > 0:
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.writelines(fixed_lines)
                  print(f'✅ Fixed {fixes} broken strings in {filepath}')
              else:
                  print(f'✓ No broken strings in {filepath}')

          # ✅ إصلاح خاص لـ rawJson cast في core.dart
          core_path = 'lib/core.dart'
          if os.path.exists(core_path):
              with open(core_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              modified = False

              if 'rawJson: item));' in content:
                  content = content.replace(
                      'rawJson: item));',
                      'rawJson: Map<String, dynamic>.from(item)));'
                  )
                  modified = True
                  print('✅ Fixed rawJson cast (item)')

              if 'rawJson: item)' in content and 'rawJson: Map' not in content:
                  content = content.replace(
                      'rawJson: item)',
                      'rawJson: Map<String, dynamic>.from(item))'
                  )
                  modified = True
                  print('✅ Fixed rawJson cast (item - variant 2)')

              if modified:
                  with open(core_path, 'w', encoding='utf-8') as f:
                      f.write(content)

          print('✅ String literal fix complete')
          PYEOF

          echo "=== التحقق من الإصلاحات ==="
          echo "ملفات تحتوي على \\n الصحيح:"
          grep -l "split('\\n')" lib/*.dart 2>/dev/null || echo "لا يوجد split('\\n')"
          grep -l "join('\\n')" lib/*.dart 2>/dev/null || echo "لا يوجد join('\\n')"

      # 🔥🔥🔥 إضافة جديدة: إصلاح محدد للأنماط المكسورة المتبقية 🔥🔥🔥
      - name: Fix specific broken newline patterns
        run: |
          python3 << 'PYEOF'
          import os
          import re

          files = ['lib/core.dart', 'lib/tv.dart', 'lib/ui.dart']

          for filepath in files:
              if not os.path.exists(filepath):
                  continue

              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()

              original = content
              fixes = 0

              # إصلاح: split(' + سطر جديد + ')  =>  split('\n')
              content, n = re.subn(r"split\('\s*\n\s*'\)", "split('\\n')", content)
              fixes += n

              # إصلاح: join(' + سطر جديد + ')  =>  join('\n')
              content, n = re.subn(r"join\('\s*\n\s*'\)", "join('\\n')", content)
              fixes += n

              # إصلاح: أي نص متعدد الأسطر داخل single quotes
              # مثل: 'هل أنت متأكد...\nسيتم حذف...'
              content, n = re.subn(r"'([^']*)\n([^']*)'", r"'\1\\n\2'", content)
              fixes += n

              if content != original:
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f'✅ Fixed {fixes} specific patterns in {filepath}')
              else:
                  print(f'✓ No specific patterns to fix in {filepath}')

          print('✅ Specific pattern fix complete')
          PYEOF

          echo "=== التحقق النهائي ==="
          echo "الأسطر التي تحتوي على split أو join:"
          grep -n "split\|join" lib/core.dart | grep -v "//" | head -20
          echo ""
          grep -n "split\|join" lib/tv.dart | grep -v "//" | head -10
          echo ""
          grep -n "split\|join" lib/ui.dart | grep -v "//" | head -10

      - name: Build MOBILE APK
        run: |
          echo "=== بناء تطبيق الجوال ==="
          flutter build apk --release -t lib/main.dart
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/tele-cinema-MOBILE.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Build TV APK
        run: |
          echo "=== بناء تطبيق التلفزيون ==="
          sed -i 's/android:label="تلي سينما"/android:label="تلي سينما TV"/' android/app/src/main/AndroidManifest.xml
          flutter build apk --release -t lib/app_tv.dart
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/tele-cinema-TV.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-apks
          path: |
            build/app/outputs/flutter-apk/tele-cinema-MOBILE.apk
            build/app/outputs/flutter-apk/tele-cinema-TV.apk
