name: tele_cinema
description: مشغل أفلام احترافي لقنوات تليجرام العامة
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  cached_network_image: ^3.3.0
  video_player: ^2.8.1
  volume_controller: ^2.0.7
  wakelock_plus: ^1.2.8
  connectivity_plus: ^6.1.0
  chewie: ^1.7.4
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^17.2.4
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^17.2.4
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  wakelock_plus: 1.2.8
  package_info_plus: 8.0.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/iconic.png"
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: "assets/iconic.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
